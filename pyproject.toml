[project]
name = "uiuc-portal"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "numpy>=1.26",
  "unidecode>=1.3",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "psycopg-pool>=3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/api_tests"]
pythonpath = [".", "apps/api"]
