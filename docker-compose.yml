# One command: `docker compose up -d` pulls the prebuilt images (data included) from GHCR, pulls the
# Ollama models on first run, and serves the portal on http://localhost:${WEB_PORT:-3000}.
# Developers rebuild everything from source with `docker compose build`.
x-api-image: &api-image
  image: ghcr.io/qh-fol-in-luv-w-data/uiuc-research-portal-api:${PORTAL_TAG:-latest}
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-api-env: &api-env
  DATABASE_URL: postgresql://portal:portal@db:5432/portal
  # Ollama on the host by default (Docker on macOS has no Metal GPU). Without one, run
  # `docker compose --profile ollama up -d` with OLLAMA_URL=http://ollama:11434.
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
  # finetuned query-understanding model (optional: without it the chat model runs few-shot)
  OLLAMA_QU_MODEL: ${OLLAMA_QU_MODEL:-hodacquan2004/uiuc-qu:4b}  # https://ollama.com/hodacquan2004/uiuc-qu
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}

services:
  db:
    # pgvector + the portal database restored automatically on first start (see db/Dockerfile)
    build:
      context: db
    image: ghcr.io/qh-fol-in-luv-w-data/uiuc-research-portal-db:${PORTAL_TAG:-latest}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: during the first-start restore the entrypoint's temporary server
      # answers on the socket only, so this turns healthy once the data is actually loaded
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10m  # first start restores the baked-in data (a few minutes)

  # One-shot first-run setup: schema, data (dump restore, or full ingest as fallback), Ollama models.
  # Does nothing on later runs when the data and models are already there.
  setup:
    <<: *api-image
    command: ["/app/.venv/bin/python", "-m", "ingest", "bootstrap"]
    environment:
      <<: *api-env
      DUMP_URL: ${DUMP_URL:-}
    volumes:
      - ./db/dump:/app/db/dump:ro
      - ./data:/app/data:ro
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    build:  # only this service builds the image; `setup` reuses it
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-env
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-8010}:8010"
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: apps/web
    image: ghcr.io/qh-fol-in-luv-w-data/uiuc-research-portal-web:${PORTAL_TAG:-latest}
    environment:
      API_URL: http://api:8010
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional bundled Ollama for machines without one (CPU only inside Docker on macOS: slow).
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${OLLAMA_PORT:-11435}:11434"

volumes:
  pgdata: {}
  ollama: {}
