# One command: `docker compose up -d` (or `make up`) builds everything, loads the data and pulls the
# Ollama models on first run, then serves the portal on http://localhost:${WEB_PORT:-3000}.
x-api-image: &api-image
  build:
    context: .
    dockerfile: apps/api/Dockerfile
  image: uiuc-research-portal-api:latest
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-api-env: &api-env
  DATABASE_URL: postgresql://portal:portal@db:5432/portal
  # Ollama on the host by default (Docker on macOS has no Metal GPU). Without one, run
  # `docker compose --profile ollama up -d` with OLLAMA_URL=http://ollama:11434.
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen3:4b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: portal
      POSTGRES_DB: portal
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot first-run setup: schema, data (dump restore, or full ingest as fallback), Ollama models.
  # Does nothing on later runs when the data and models are already there.
  setup:
    <<: *api-image
    command: ["/app/.venv/bin/python", "-m", "ingest", "bootstrap"]
    environment:
      <<: *api-env
      DUMP_URL: ${DUMP_URL:-}
    volumes:
      - ./db/dump:/app/db/dump:ro
      - ./data:/app/data:ro
    healthcheck:
      disable: true
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *api-image
    environment:
      <<: *api-env
    ports:
      - "${API_PORT:-8010}:8010"
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    build:
      context: apps/web
    image: uiuc-research-portal-web:latest
    environment:
      API_URL: http://api:8010
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Optional bundled Ollama for machines without one (CPU only inside Docker on macOS: slow).
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11435}:11434"

volumes:
  pgdata: {}
  ollama: {}
